
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcart
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudcart
  template:
    metadata:
      labels:
        app: cloudcart
    spec:
      containers:
        - name: cloudcart
          image: pavan404/cloudcart:MD
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcart-service
spec:
  type: NodePort
  selector:
    app: cloudcart
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
