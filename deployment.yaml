apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudcart-deployment
  labels:
    app: cloudcart

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloudcart

  template:
    metadata:
      labels:
        app: cloudcart

    spec:
      containers:
        - name: cloudcart
          image: pavan404/cloudcart:MD
          ports:
            - containerPort: 8000
